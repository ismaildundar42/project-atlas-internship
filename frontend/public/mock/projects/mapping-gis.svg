<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.3" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Modern Graphic Accents -->
  <circle cx="720" cy="80" r="160" fill="#4ade80" fill-opacity="0.08" filter="blur(20px)" />
  <circle cx="80" cy="380" r="120" fill="#14532d" fill-opacity="0.4" />
  
  <!-- Blueprint Technical Lines -->
  <line x1="60" y1="360" x2="740" y2="360" stroke="#4ade80" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="60" y1="365" x2="240" y2="365" stroke="#4ade80" stroke-width="2" />
  <line x1="60" y1="80" x2="60" y2="360" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <line x1="740" y1="80" x2="740" y2="360" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Geometric Abstract Industrial Shapes -->
  <g transform="translate(560, 160)" opacity="0.25">
    <rect x="0" y="0" width="140" height="140" rx="12" fill="none" stroke="#4ade80" stroke-width="2" />
    <circle cx="70" cy="70" r="50" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="8 6" />
    <line x1="10" y1="70" x2="130" y2="70" stroke="#4ade80" stroke-width="1" />
    <line x1="70" y1="10" x2="70" y2="130" stroke="#4ade80" stroke-width="1" />
  </g>

  <!-- Brand Tag -->
  <rect x="60" y="60" width="160" height="28" rx="14" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
  <circle cx="74" cy="74" r="5" fill="#4ade80" />
  <text x="88" y="79" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">DEMİR EXPORT AR-GE</text>

  <!-- Titles -->
  <text x="60" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800">
    CBS & Jeolojik 3D Sayısal Harita
  </text>
  <text x="60" y="280" fill="rgba(255, 255, 255, 0.75)" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">
    Maden Jeolojisi • Şev Duraylılık Analizi
  </text>

  <!-- Technical Telemetry Badges -->
  <g transform="translate(60, 310)">
    <rect x="0" y="0" width="110" height="24" rx="4" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="12" y="16" fill="#4ade80" font-family="monospace" font-size="11" font-weight="700">STATUS // ACTIVE</text>

    <rect x="120" y="0" width="110" height="24" rx="4" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="132" y="16" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">SYS // VERIFIED</text>
  </g>
</svg>